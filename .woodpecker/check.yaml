# Lint + test on every push and PR (moved from GitHub Actions). No secrets, so
# pull_request is safe here. golang:1.26 is pulled through the zot cache.
when:
  - event: [push, pull_request]

steps:
  - name: test
    image: golang:1.26
    commands:
      # Committed protobuf stubs are authoritative; touch them so make doesn't try
      # to regenerate (which needs protoc, not present here) -- mirrors Dockerfile.
      - touch internal/tunnel/tunnel.pb.go internal/tunnel/tunnel_grpc.pb.go
      - make test

  - name: lint
    image: golang:1.26
    commands:
      - touch internal/tunnel/tunnel.pb.go internal/tunnel/tunnel_grpc.pb.go
      - make lint
