#
# Builds-only goreleaser config for the Woodpecker image pipeline
# (.woodpecker/build.yaml). It cross-builds all three binaries for both arches on
# a single amd64 worker (CGO_ENABLED=0, no cross toolchain, no QEMU); the
# multi-arch images are assembled and pushed by buildctl against the
# Dockerfile.cross.* files on kubepi0 -- so there is no `dockers:` /
# `docker_manifests:` section here.
#
# Version stamping comes from the pipeline env (GIT_BRANCH = the v* tag,
# GIT_HASH = the commit), matching the ldflags the legacy Dockerfile set.

version: 2

project_name: oes-birger

snapshot:
  version_template: "{{ .Env.GIT_BRANCH }}"

checksum:
  disable: true

release:
  disable: true

changelog:
  disable: true

builds:
  - id: agent-client
    main: ./app/client
    binary: agent-client
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/OpsMx/go-app-base/version.buildType=release
      - -X github.com/OpsMx/go-app-base/version.gitHash={{ .Env.GIT_HASH }}
      - -X github.com/OpsMx/go-app-base/version.gitBranch={{ .Env.GIT_BRANCH }}
    env:
      - CGO_ENABLED=0

  - id: agent-controller
    main: ./app/server
    binary: agent-controller
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/OpsMx/go-app-base/version.buildType=release
      - -X github.com/OpsMx/go-app-base/version.gitHash={{ .Env.GIT_HASH }}
      - -X github.com/OpsMx/go-app-base/version.gitBranch={{ .Env.GIT_BRANCH }}
    env:
      - CGO_ENABLED=0

  - id: get-creds
    main: ./app/get-creds
    binary: get-creds
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/OpsMx/go-app-base/version.buildType=release
      - -X github.com/OpsMx/go-app-base/version.gitHash={{ .Env.GIT_HASH }}
      - -X github.com/OpsMx/go-app-base/version.gitBranch={{ .Env.GIT_BRANCH }}
    env:
      - CGO_ENABLED=0
